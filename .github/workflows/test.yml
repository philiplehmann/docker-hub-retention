name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build: # make sure build/ci work properly
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - run: bun run release:build
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - run: bun run build
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - run: bun test --coverage
  test:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - name: docker hub retention
        id: registry 
        uses: ./
        with:
          repository: "philiplehmann/puppeteer" # required, repository name
          dryrun: "true" # optional, default is false
          match: "([0-9\\.]+)-([0-9]+)" # optional
          retention: "7d" # optional, default is 30d
